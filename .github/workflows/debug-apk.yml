name: Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'td/**'

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Lite debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.0"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-debug-apk-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-debug-apk-gradle-
            ${{ runner.os }}-gradle-

      # ユニットテストはここでは走らせない。既存の失敗があると APK の生成まで進まないため。
      - name: Build Lite debug APK
        run: >-
          ./gradlew
          :app:assembleLiteStandardDebug
          --stacktrace
          --no-daemon
          --max-workers=2
          -Dorg.gradle.jvmargs=-Xmx2g

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: lite-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/liteStandard/debug/*.apk
          if-no-files-found: error
          retention-days: 14
