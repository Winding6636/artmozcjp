name: Debug APK

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'ビルドする版'
        type: choice
        options:
          - lite
          - full
          - both
        default: lite

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: inputs.edition == 'lite' || inputs.edition == 'both'
    name: Build Lite debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.0"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-debug-apk-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-debug-apk-gradle-
            ${{ runner.os }}-gradle-

      # ユニットテストはここでは走らせない。既存の失敗があると APK の生成まで進まないため。
      - name: Build Lite debug APK
        run: >-
          ./gradlew
          :app:assembleLiteStandardDebug
          --stacktrace
          --no-daemon
          --max-workers=2
          -Dorg.gradle.jvmargs=-Xmx2g

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: lite-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/liteStandard/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  build-full:
    if: inputs.edition == 'full' || inputs.edition == 'both'
    name: Build Full debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ZENZ_MODEL_CACHE_DIR: ${{ github.workspace }}/.zenz-model-cache
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-37.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-debug-apk-full-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-debug-apk-full-gradle-
            ${{ runner.os }}-gradle-

      - name: Cache Zenz model
        uses: actions/cache@v5
        with:
          path: .zenz-model-cache
          key: ${{ runner.os }}-zenz-model-v2-4f5423f0fad41a73b1242eb96fe5c12ae4fdca83-Q5_K_M-ggml-model-Q5_K_M.gguf

      - name: Build Full debug APK
        run: >-
          ./gradlew
          :app:assembleFullStandardDebug
          --stacktrace
          --no-daemon
          --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: full-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/fullStandard/debug/*.apk
          if-no-files-found: error
          retention-days: 14
